plugins {
    id 'com.android.application'
}

android {
    namespace 'com.blinddroid.mixplayer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.blinddroid.mixplayer.accessible'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '2.0.0-accessible'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}
